<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>
    <title>ローグを作ろう！</title>
</head>
<body>
    <script>
    kaplay({
        width: 800,      // 画面の横幅
        height: 600,     // 画面の高さ
    });


    // 1. Create the canvas with a specific width and height
    const myCanvas = makeCanvas(320, 240);

    // 2. Draw something inside it
    myCanvas.draw(() => {
        // You can use any standard KAPLAY draw functions here
        drawRect({
            width: 100,
            height: 100,
            pos: vec2(10, 10),
            color: rgb(255, 0, 0),
        });
    });

    const dataURL = myCanvas.toDataURL();
    loadSprite("myProceduralSprite", dataURL);

    // Later...
    add([
        sprite("myProceduralSprite"),
        pos(80, 80),
    ]);

    function drawFrame(rad) {
        const dummyCanvas = document.createElement('canvas');

        // 2. Set the dimensions
        dummyCanvas.width = 250;
        dummyCanvas.height = 250;

        // 3. Get the context (the "pen")
        const ctx = dummyCanvas.getContext('2d');
        console.log(ctx);

        // 1. 背景を赤で塗りつぶし
        ctx.fillStyle = 'blue';
        // ctx.fillRect(0, 0, 100, 100);
        ctx.fillRect(rad/2, rad/2, rad, rad);

        // 2. 中央に緑の正方形を描画
        ctx.fillStyle = 'transparent';
        ctx.fillRect(rad/2, rad/2, 50, 50);

        // 3. 白い枠線を追加
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'white';
        ctx.strokeRect(rad/2, rad/2, 50, 50);

        const dataURL2 = dummyCanvas.toDataURL();
        dummyCanvas.remove();

        return dataURL2;
    }

    loadSprite("myProceduralSprite2", drawFrame(77));
    loadSprite("myProceduralSprite3", drawFrame(120));
    loadSprite("myProceduralSprite4", drawFrame(190));

    // Later...
    add([
        sprite("myProceduralSprite2"),
        pos(280, 280),
    ]);

    add([
        sprite("myProceduralSprite3"),
        pos(20, 180),
    ]);

    add([
        sprite("myProceduralSprite2"),
        pos(68, 100),
    ]);

    wait(3, () => {
        debug.log("さようなら");
        myCanvas.clear();
        myCanvas.free();
    })

    </script>
</body>
</html>
